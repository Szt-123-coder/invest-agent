<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投资学习 Agent</title>
<link rel="stylesheet" href="/static/common.css">
</head>
<body>
<main>
  <header>
    <h1>投资学习 Agent</h1>
    <nav><a href="/stock">股票页面</a> · <a href="/digest">每日摘要</a> · <a href="/eval">评测面板 →</a></nav>
  </header>
  <p class="sub">问一句话，看它一步步查数据、读新闻，再给出有依据的回答。仅供学习，不构成投资建议。</p>
  <form id="f">
    <input id="q" type="text" placeholder="例如：澳元最近怎么样，要不要换？" autocomplete="off">
    <button id="go">提问</button>
  </form>
  <div class="chips">
    <span class="chip">澳元最近怎么样，要不要换？</span>
    <span class="chip">苹果股价最近走势如何？</span>
    <span class="chip">澳元跌了就提醒我</span>
    <span class="chip">美元跌到 7.0 提醒我</span>
    <span class="chip">我的提醒有哪些</span>
  </div>
  <ol class="steps" id="steps"></ol>
  <div id="answer"></div>
  <details>
    <summary>访问密码（没有密码时使用演示模式）</summary>
    <p><input id="pw" type="password" placeholder="ACCESS_PASSWORD"> 保存在本浏览器</p>
  </details>
</main>
<script src="/static/common.js"></script>
<script>
const $ = id => document.getElementById(id);
const session = (() => { try { return localStorage.sid || (localStorage.sid = crypto.randomUUID()); } catch { return 'web'; } })();
try { $('pw').value = localStorage.pw || ''; } catch {}
$('pw').addEventListener('change', e => { try { localStorage.pw = e.target.value; } catch {} });
document.querySelectorAll('.chip').forEach(c => c.onclick = () => { $('q').value = c.textContent; ask(); });
$('f').onsubmit = e => { e.preventDefault(); ask(); };


async function ask() {
  const question = $('q').value.trim(); if (!question) return;
  $('go').disabled = true; $('steps').innerHTML = ''; $('answer').innerHTML = '';
  const calls = {}; let n = 0;
  await streamAsk(question, session, show);
  $('go').disabled = false;

  function show(e) {
    if (e.type === 'tool_call') {
      const li = el('li', 'step'), head = el('div', 'head');
      head.append(el('span', 'n', `第 ${++n} 步`), el('span', null, NAMES[e.name] || e.name), el('span', 'n', '运行中…'));
      li.append(head, el('pre', null, JSON.stringify(e.args, null, 0)));
      $('steps').append(li); calls[e.id] = li;
    } else if (e.type === 'tool_result') {
      const li = calls[e.id]; if (!li) return;
      const st = li.querySelector('.head .n:last-child'); st.textContent = e.ok ? '✓ 完成' : '✗ 失败'; st.className = e.ok ? 'ok' : 'fail';
      li.append(el('pre', null, e.content));
    } else if (e.type === 'answer') {
      $('answer').replaceChildren(e.structured ? card(e.structured) : el('div', 'answer', e.content));
    } else if (e.type === 'done') {
      $('answer').append(el('div', 'meta', `共 ${n} 步，用时 ${(e.duration_ms / 1000).toFixed(1)} 秒 · 运行编号 ${e.run_id}`));
    } else if (e.type === 'start') {
      $('steps').before(Object.assign(el('div', 'meta', `模型：${e.model}`), { id:'model' })); document.querySelectorAll('#model').forEach((m, k, all) => k < all.length - 1 && m.remove());
    } else if (e.type === 'error') {
      $('answer').replaceChildren(el('div', 'answer fail', '出错了：' + e.message));
    }
  }
}
</script>
</body>
</html>
