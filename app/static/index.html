<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投资学习 Agent</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --quiet:#6b6b66; --line:#e3e2dd; --accent:#2563eb; --good:#15803d; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --card:#1f1f1d; --ink:#ededea; --quiet:#a3a39d; --line:#33332f; --accent:#6ea0ff; --good:#4ade80; --bad:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size:22px; margin:0; }
  a { color:var(--accent); }
  .sub { color:var(--quiet); margin:4px 0 20px; }
  form { display:flex; gap:8px; }
  input[type=text] { flex:1; min-width:0; padding:12px 14px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); }
  button { padding:0 18px; font-size:15px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 24px; }
  .chip { padding:6px 12px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--ink); cursor:pointer; font-size:14px; }
  .steps { list-style:none; padding:0; margin:0; }
  .step { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:8px; animation: in .25s ease; }
  .step .head { display:flex; gap:8px; align-items:center; font-weight:600; }
  .step .n { color:var(--quiet); font-weight:400; font-size:13px; }
  .step pre { margin:6px 0 0; white-space:pre-wrap; word-break:break-all; font-size:12.5px; color:var(--quiet); max-height:160px; overflow:auto; }
  .ok { color:var(--good); } .fail { color:var(--bad); }
  .answer { background:var(--card); border:2px solid var(--accent); border-radius:12px; padding:14px 16px; margin-top:16px; white-space:pre-wrap; }
  .meta { color:var(--quiet); font-size:13px; margin-top:8px; }
  details { margin-top:32px; color:var(--quiet); font-size:14px; }
  details input { padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); }
  @keyframes in { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>投资学习 Agent</h1>
    <a href="/eval">评测面板 →</a>
  </header>
  <p class="sub">问一句话，看它一步步查数据、读新闻，再给出有依据的回答。仅供学习，不构成投资建议。</p>
  <form id="f">
    <input id="q" type="text" placeholder="例如：澳元最近怎么样，要不要换？" autocomplete="off">
    <button id="go">提问</button>
  </form>
  <div class="chips">
    <span class="chip">澳元最近怎么样，要不要换？</span>
    <span class="chip">苹果股价最近走势如何？</span>
    <span class="chip">澳元跌了就提醒我</span>
    <span class="chip">美元跌到 7.0 提醒我</span>
    <span class="chip">我的提醒有哪些</span>
  </div>
  <ol class="steps" id="steps"></ol>
  <div id="answer"></div>
  <details>
    <summary>访问密码（没有密码时使用演示模式）</summary>
    <p><input id="pw" type="password" placeholder="ACCESS_PASSWORD"> 保存在本浏览器</p>
  </details>
</main>
<script>
const NAMES = { get_quote:'查最新价格', get_history:'查历史走势', search_news:'搜索新闻', set_price_alert:'设价位提醒',
  set_move_alert:'设波动提醒', list_alerts:'查看提醒', delete_alert:'删除提醒', watch:'修改关注', remember_preference:'记住偏好' };
const $ = id => document.getElementById(id);
const session = (() => { try { return localStorage.sid || (localStorage.sid = crypto.randomUUID()); } catch { return 'web'; } })();
try { $('pw').value = localStorage.pw || ''; } catch {}
$('pw').addEventListener('change', e => { try { localStorage.pw = e.target.value; } catch {} });
document.querySelectorAll('.chip').forEach(c => c.onclick = () => { $('q').value = c.textContent; ask(); });
$('f').onsubmit = e => { e.preventDefault(); ask(); };

function el(tag, cls, text) { const x = document.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; }

async function ask() {
  const question = $('q').value.trim(); if (!question) return;
  $('go').disabled = true; $('steps').innerHTML = ''; $('answer').innerHTML = '';
  const calls = {}; let n = 0;
  const headers = { 'Content-Type': 'application/json' };
  if ($('pw').value) headers.Authorization = 'Bearer ' + $('pw').value;
  try {
    const res = await fetch('/api/ask', { method:'POST', headers, body: JSON.stringify({ question, session_id: session }) });
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true });
      let i; while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (line.startsWith('data: ')) show(JSON.parse(line.slice(6)));
      }
    }
  } catch (err) { show({ type:'error', message: String(err) }); }
  $('go').disabled = false;

  function show(e) {
    if (e.type === 'tool_call') {
      const li = el('li', 'step'), head = el('div', 'head');
      head.append(el('span', 'n', `第 ${++n} 步`), el('span', null, NAMES[e.name] || e.name), el('span', 'n', '运行中…'));
      li.append(head, el('pre', null, JSON.stringify(e.args, null, 0)));
      $('steps').append(li); calls[e.id] = li;
    } else if (e.type === 'tool_result') {
      const li = calls[e.id]; if (!li) return;
      const st = li.querySelector('.head .n:last-child'); st.textContent = e.ok ? '✓ 完成' : '✗ 失败'; st.className = e.ok ? 'ok' : 'fail';
      li.append(el('pre', null, e.content));
    } else if (e.type === 'answer') {
      $('answer').replaceChildren(el('div', 'answer', e.content));
    } else if (e.type === 'done') {
      $('answer').append(el('div', 'meta', `共 ${n} 步，用时 ${(e.duration_ms / 1000).toFixed(1)} 秒 · 运行编号 ${e.run_id}`));
    } else if (e.type === 'start') {
      $('steps').before(Object.assign(el('div', 'meta', `模型：${e.model}`), { id:'model' })); document.querySelectorAll('#model').forEach((m, k, all) => k < all.length - 1 && m.remove());
    } else if (e.type === 'error') {
      $('answer').replaceChildren(el('div', 'answer fail', '出错了：' + e.message));
    }
  }
}
</script>
</body>
</html>
